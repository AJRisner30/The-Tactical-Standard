    <script>
      (function() {
        // Intercept Vite HMR WebSockets in proxy container environments where HMR is disabled
        if (typeof window !== 'undefined' && window.WebSocket) {
          const NativeWebSocket = window.WebSocket;
          class MockViteWebSocket extends EventTarget {
            constructor(url, protocols) {
              super();
              this.url = url || '';
              this.protocol = Array.isArray(protocols) ? protocols[0] : (protocols || 'vite-hmr');
              this.readyState = 1; // WebSocket.OPEN
              this.OPEN = 1;
              this.CONNECTING = 0;
              this.CLOSING = 2;
              this.CLOSED = 3;
              this.binaryType = 'blob';
              this.bufferedAmount = 0;
              this.extensions = '';
              setTimeout(() => {
                this.dispatchEvent(new Event('open'));
              }, 0);
            }
            send(data) {}
            close() {
              this.readyState = 3;
              this.dispatchEvent(new Event('close'));
            }
          }

          const ProxiedWebSocket = function(url, protocols) {
            const isViteHmr = 
              (typeof protocols === 'string' && (protocols === 'vite-hmr' || protocols === 'vite-ping')) ||
              (Array.isArray(protocols) && (protocols.includes('vite-hmr') || protocols.includes('vite-ping'))) ||
              (typeof url === 'string' && (url.includes('vite-hmr') || url.includes('token=')));
            
            if (isViteHmr) {
              return new MockViteWebSocket(url, protocols);
            }
            return new NativeWebSocket(url, protocols);
          };

          ProxiedWebSocket.prototype = NativeWebSocket.prototype;
          ProxiedWebSocket.CONNECTING = 0;
          ProxiedWebSocket.OPEN = 1;
          ProxiedWebSocket.CLOSING = 2;
          ProxiedWebSocket.CLOSED = 3;

          window.WebSocket = ProxiedWebSocket;
        }

        // Gracefully intercept benign dev proxy WebSocket closed errors
        window.addEventListener('error', function(e) {
          if (e && e.message && (e.message.indexOf('WebSocket') !== -1 || e.message.indexOf('closed without opened') !== -1)) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          if (e && e.reason && typeof e.reason.message === 'string' && (e.reason.message.indexOf('WebSocket') !== -1 || e.reason.message.indexOf('closed without opened') !== -1)) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
        // Immediately purge any stale Service Worker or poisoned Cache Storage entries
        if (typeof navigator !== 'undefined' && 'serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (var i = 0; i < registrations.length; i++) {
              registrations[i].unregister().catch(function() {});
            }
          }).catch(function() {});
        }
        if (typeof window !== 'undefined' && 'caches' in window) {
          window.caches.keys().then(function(keys) {
            for (var j = 0; j < keys.length; j++) {
              window.caches.delete(keys[j]).catch(function() {});
            }
          }).catch(function() {});
        }
      })();
    </script>
