<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="brassBevelFav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="25%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#B45309" />
      <stop offset="75%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <linearGradient id="obsidianShieldFav" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E242B" />
      <stop offset="35%" stop-color="#11161C" />
      <stop offset="70%" stop-color="#090B0D" />
      <stop offset="100%" stop-color="#040506" />
    </linearGradient>

    <linearGradient id="brassGoldFav" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="45%" stop-color="#FBBF24" />
      <stop offset="75%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <linearGradient id="goldStarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="50%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <linearGradient id="amberGlowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#92400E" stop-opacity="0.0" />
    </linearGradient>

    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#D97706" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512"  fill="#090B0D"/>

  <!-- Subtle Radial Background Glow -->
  <radialGradient id="centerAura" cx="50%" cy="45%" r="60%">
    <stop offset="0%" stop-color="#D97706" stop-opacity="0.22" />
    <stop offset="70%" stop-color="#090B0D" stop-opacity="0.0" />
  </radialGradient>
  <rect width="512" height="512" fill="url(#centerAura)" />

  <!-- Military Tactical Shield Crest (Centered) -->
  <g filter="url(#iconShadow)" transform="translate(256, 252) scale(1.02) translate(-400, -235)">
    <!-- Outer Shield Brass Metallic Layer -->
    <path d="M 400 32 L 485 52 L 565 82 L 565 240 C 565 315, 490 380, 400 425 C 310 380, 235 315, 235 240 L 235 82 L 315 52 Z"
          fill="url(#brassBevelFav)" stroke="#040506" stroke-width="4" />

    <!-- Inset Gunmetal Layer -->
    <path d="M 400 44 L 478 62 L 550 90 L 550 236 C 550 304, 480 366, 400 408 C 320 366, 250 304, 250 236 L 250 90 L 322 62 Z"
          fill="#090B0D" stroke="#D97706" stroke-width="2" />

    <!-- Main Obsidian Field -->
    <path d="M 400 50 L 474 68 L 542 94 L 542 233 C 542 298, 474 358, 400 398 C 326 358, 258 298, 258 233 L 258 94 L 326 68 Z"
          fill="url(#obsidianShieldFav)" />

    <!-- Amber Ambient Aura Inside Shield -->
    <path d="M 400 50 L 474 68 L 542 94 L 542 233 C 542 298, 474 358, 400 398 C 326 358, 258 298, 258 233 L 258 94 L 326 68 Z"
          fill="url(#amberGlowGrad)" />

    <!-- Tactical Gold Rim -->
    <path d="M 400 60 L 466 76 L 532 100 L 532 230 C 532 290, 468 346, 400 386 C 332 346, 268 290, 268 230 L 268 100 L 334 76 Z"
          fill="none" stroke="#F59E0B" stroke-width="2.5" />

    <!-- 5-Point Command Gold Star -->
    <g transform="translate(400, 86)">
      <polygon points="0,-18 5,-5 18,-5 8,4 12,17 0,9 -12,17 -8,4 -18,-5 -5,-5" fill="url(#goldStarGrad)" stroke="#78350F" stroke-width="0.8" />
    </g>

    <!-- Chevrons -->
    <path d="M 370 126 L 400 110 L 430 126 L 424 134 L 400 120 L 376 134 Z" fill="url(#brassGoldFav)" />
    <path d="M 374 139 L 400 124 L 426 139 L 420 147 L 400 135 L 380 147 Z" fill="url(#brassGoldFav)" />

    <!-- Warfighter Silhouette -->
    <g transform="translate(400, 240)">
      <path d="M -12,48 L -24,80 L -38,105 L -52,118 L -32,118 L -22,100 L -6,62 Z" fill="#1E242B" />
      <path d="M 10,48 L 26,72 L 32,95 L 16,114 L 35,116 L 44,112 L 42,95 L 32,70 L 18,45 Z" fill="#2B333C" />
      <path d="M -20,4 L 20,-2 L 18,44 L -16,46 Z" fill="#262F38" stroke="#D97706" stroke-width="1.2" />
      <rect x="-14" y="6" width="28" height="8" rx="1.5" fill="#090B0D" />
      <text x="0" y="12.5" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="6.5" fill="#FBBF24" text-anchor="middle">TACSTD</text>
      <circle cx="43" cy="-7" r="5" fill="#CBD5E1" />
      <circle cx="-42" cy="2" r="4.5" fill="#64748B" />
      <path d="M 4,-12 L 14,-14 L 16,-20 L 14,-26 L 8,-28 L 0,-26 L -2,-18 L 2,-12 Z" fill="#E2E8F0" />
      <path d="M -3,-22 Q 4,-33 16,-28 L 17,-21 L 4,-20 L -2,-17 Z" fill="#334155" />
    </g>

    <!-- ★ MILITARY ★ Banner -->
    <path d="M 300 342 C 345 334, 455 334, 500 342 L 492 372 C 455 364, 345 364, 308 372 Z" 
          fill="url(#brassGoldFav)" stroke="#090B0D" stroke-width="2" />
    <text x="400" y="361" font-family="'Impact', 'Arial Black', sans-serif" font-size="17" font-weight="900" fill="#090B0D" text-anchor="middle" letter-spacing="3">&#9733; MILITARY &#9733;</text>
    <text x="400" y="394" font-family="'Impact', 'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#FBBF24" text-anchor="middle" letter-spacing="3">TTS</text>
  </g>
</svg>